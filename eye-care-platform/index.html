<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>青眸 · 眼健康管理平台</title>
  <link rel="stylesheet" href="css/style.css" />
  <!-- Chart.js（可视化图表，国内 CDN） -->
  <script src="https://cdn.bootcdn.net/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>

  <!-- ========== 登录 / 注册页 ========== -->
  <section id="auth-view" class="auth-view hidden">
    <div class="auth-hero">
      <div class="auth-hero-inner">
        <div class="brand-mark">
          <svg viewBox="0 0 48 48" width="44" height="44" fill="none" aria-hidden="true">
            <path d="M4 24s7-13 20-13 20 13 20 13-7 13-20 13S4 24 4 24z" stroke="currentColor" stroke-width="2.4"/>
            <circle cx="24" cy="24" r="7.5" stroke="currentColor" stroke-width="2.4"/>
            <circle cx="24" cy="24" r="2.6" fill="currentColor"/>
          </svg>
          <span>青眸 QINGMOU</span>
        </div>
        <h1 class="auth-title">让每一次<br/>眼科检查都被认真对待</h1>
        <p class="auth-sub">检查单 OCR 识别 · AI 个性化解读 · 护眼学习打卡<br/>一站式眼健康档案管理平台</p>
        <ul class="auth-feats">
          <li><span class="dot"></span>医院检查单一键识别，数据永久留存</li>
          <li><span class="dot"></span>AI 结合个人档案给出针对性建议</li>
          <li><span class="dot"></span>课表打卡与视频资源，养成护眼习惯</li>
        </ul>
        <div class="auth-leaf" aria-hidden="true"></div>
      </div>
    </div>
    <div class="auth-panel">
      <div class="auth-card">
        <div class="auth-tabs">
          <button class="auth-tab active" data-mode="login">登录</button>
          <button class="auth-tab" data-mode="register">注册</button>
          <span class="auth-tab-line"></span>
        </div>
        <form id="auth-form" autocomplete="off">
          <div class="field">
            <label>账号</label>
            <input type="text" id="auth-username" placeholder="请输入用户名 / 手机号" />
          </div>
          <div class="field">
            <label>密码</label>
            <input type="password" id="auth-password" placeholder="请输入密码（至少 6 位）" />
          </div>
          <div class="field field-register hidden">
            <label>确认密码</label>
            <input type="password" id="auth-password2" placeholder="再次输入密码" />
          </div>
          <p id="auth-error" class="form-error hidden"></p>
          <button type="submit" class="btn btn-primary btn-block" id="auth-submit">登 录</button>
          <p class="auth-tip">演示环境数据保存在浏览器本地，清除缓存将丢失</p>
        </form>
      </div>
      <p class="auth-footer">© 2026 青眸眼健康管理平台 · 框架演示版</p>
    </div>
  </section>

  <!-- ========== 应用主外壳 ========== -->
  <div id="app-shell" class="app-shell hidden">
    <aside class="sidebar">
      <div class="side-brand">
        <svg viewBox="0 0 48 48" width="30" height="30" fill="none" aria-hidden="true">
          <path d="M4 24s7-13 20-13 20 13 20 13-7 13-20 13S4 24 4 24z" stroke="currentColor" stroke-width="2.4"/>
          <circle cx="24" cy="24" r="7.5" stroke="currentColor" stroke-width="2.4"/>
          <circle cx="24" cy="24" r="2.6" fill="currentColor"/>
        </svg>
        <span>青眸</span>
      </div>
      <nav class="side-nav" id="side-nav">
        <a href="#/dashboard" data-route="dashboard"><i class="ico ico-home"></i>工作台</a>
        <a href="#/profile" data-route="profile"><i class="ico ico-user"></i>个人档案</a>
        <a href="#/reports" data-route="reports"><i class="ico ico-doc"></i>检查单管理</a>
        <a href="#/analysis" data-route="analysis"><i class="ico ico-ai"></i>AI 分析建议</a>
        <a href="#/learning" data-route="learning"><i class="ico ico-book"></i>学习中心</a>
      </nav>
      <div class="side-footer">
        <div class="side-user" id="side-user">
          <div class="avatar" id="side-avatar">—</div>
          <div class="side-user-meta">
            <strong id="side-name">未登录</strong>
            <span id="side-role">个人用户</span>
          </div>
        </div>
        <button class="btn-logout" id="btn-logout" title="退出登录">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          退出
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h2 id="page-title">工作台</h2>
          <p id="page-desc" class="page-desc"></p>
        </div>
        <div class="topbar-right">
          <span class="today-chip" id="today-chip"></span>
        </div>
      </header>
      <div class="page" id="page"></div>
    </main>
  </div>

  <!-- 全局弹窗容器 -->
  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <!-- 脚本（普通脚本按序加载，无需构建工具，双击 index.html 即可运行） -->
  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/profile.js"></script>
  <script src="js/views/reports.js"></script>
  <script src="js/views/analysis.js"></script>
  <script src="js/views/learning.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
